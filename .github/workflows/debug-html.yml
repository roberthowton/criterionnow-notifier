name: Debug fixed scraper

on:
  push:
    branches: [claude/criterion-notifier-diagnosis-3wrz2e]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node --input-type=module -e "const s=await import('fs'); " && pnpm start
        env:
          NTFY_TOPIC: debug-dummy-${{ github.run_id }}
